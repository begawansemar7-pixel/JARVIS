name: Private Brain Tests

on:
  push:
    paths:
      - 'knowledge/**'
      - 'actions/private_brain.py'
      - 'config/private_brain.json'
      - 'tests/test_private_brain*.py'
      - 'tests/test_vault.py'
      - 'requirements*.txt'
      - '.github/workflows/private-brain-tests.yml'
  pull_request:
    paths:
      - 'knowledge/**'
      - 'actions/private_brain.py'
      - 'config/private_brain.json'
      - 'tests/test_private_brain*.py'
      - 'tests/test_vault.py'
      - 'requirements*.txt'
      - '.github/workflows/private-brain-tests.yml'

jobs:
  test-private-brain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install cryptography keyring pypdf python-docx python-pptx reportlab -r requirements-dev.txt
      - run: pytest -q tests/test_private_brain*.py tests/test_vault.py

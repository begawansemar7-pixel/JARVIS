name: Private Brain Tests

on:
  push:
    paths:
      - 'knowledge/**'
      - 'tests/test_private_brain.py'
      - 'tests/test_vault.py'
      - 'tests/test_private_brain_rag.py'
      - '.github/workflows/private-brain-tests.yml'
  pull_request:
    paths:
      - 'knowledge/**'
      - 'tests/test_private_brain.py'
      - 'tests/test_vault.py'
      - 'tests/test_private_brain_rag.py'
      - '.github/workflows/private-brain-tests.yml'

jobs:
  test-private-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install cryptography pytest
      - run: pytest -q tests/test_private_brain.py tests/test_vault.py tests/test_private_brain_rag.py

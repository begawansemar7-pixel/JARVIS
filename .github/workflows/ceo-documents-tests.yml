name: CEO Documents Tests

on:
  push:
    paths:
      - 'actions/ceo_documents.py'
      - 'documents/**'
      - 'tests/test_ceo_documents.py'
      - 'requirements*.txt'
      - '.github/workflows/ceo-documents-tests.yml'
  pull_request:
    paths:
      - 'actions/ceo_documents.py'
      - 'documents/**'
      - 'tests/test_ceo_documents.py'
      - 'requirements*.txt'
      - '.github/workflows/ceo-documents-tests.yml'

jobs:
  test-ceo-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install python-docx python-pptx reportlab -r requirements-dev.txt
      - run: python -m pytest -q tests/test_ceo_documents.py

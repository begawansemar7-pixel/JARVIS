name: Strategy Research Tests

on:
  push:
    paths:
      - 'actions/strategy_research.py'
      - 'research/**'
      - 'config/research_sources.json'
      - 'tests/test_strategy_research.py'
      - '.github/workflows/strategy-research-tests.yml'
  pull_request:
    paths:
      - 'actions/strategy_research.py'
      - 'research/**'
      - 'config/research_sources.json'
      - 'tests/test_strategy_research.py'
      - '.github/workflows/strategy-research-tests.yml'

jobs:
  test-strategy-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install beautifulsoup4 -r requirements-dev.txt
      - run: python -m pytest -q tests/test_strategy_research.py
